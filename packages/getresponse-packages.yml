method: searched
source: >-
  https://github.com/GetResponse (official org), https://www.getresponse.com/llms.txt
  (the provider's own SDK list), Packagist, npm, WordPress.org and the GitHub Releases API.
note: >-
  GetResponse ships no first-party JavaScript, Python, Ruby, Go, Java, .NET or Rust client for
  the v3 REST API. The only server-side SDK is PHP; the three Mobile SDKs wrap Mobile Push
  (Firebase Cloud Messaging), not the REST API, and are distributed from GitHub only with no
  package-registry presence. Currency is the story here: the PHP SDK last published 2023-08-22,
  before the spec version stamped 2026-07-28 that it is meant to wrap, and the official
  WordPress plugin was permanently closed on WordPress.org on 2024-04-29 at the author's request.
