aid: getresponse
name: GetResponse
description: GetResponse is an all-in-one marketing platform for email marketing, marketing automation,
  landing pages, websites, webinars, SMS, web push, ecommerce and content monetization, used by small
  businesses, marketers and enterprises. The GetResponse API v3 is a JSON REST API authenticated with
  an X-Auth-Token header carrying an API key prefixed with "api-key ", or with OAuth 2.0. The provider
  publishes a machine-readable OpenAPI 3.0.0 describing 220 operations across 141 paths and 42 product
  areas — contacts, campaigns, newsletters, autoresponders, transactional email, SMS, forms and popups,
  landing pages, websites, webinars, workflows, imports, suppressions and a full ecommerce tree of shops,
  products, variants, categories, carts, orders and taxes. The spec is discoverable through an RFC 9727
  API catalog at /.well-known/api-catalog, and GetResponse also publishes an llms.txt and its own Agent
  Skill for the public API. Enterprise customers run on the separate GetResponse MAX platform, which requires
  an additional X-Domain header.
type: Index
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
