aid: getresponse
name: GetResponse
description: >-
  GetResponse is an online marketing platform offering email marketing,
  marketing automation, landing pages, webinars, and conversion funnels for
  small businesses, marketers, and enterprises. The platform provides tools
  to grow email lists, automate campaigns, segment audiences, and engage
  customers across multiple channels. The GetResponse API v3 is a JSON REST
  API that uses X-Auth-Token header authentication to manage contacts,
  campaigns, newsletters, autoresponders, landing pages, webinars, and more.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
