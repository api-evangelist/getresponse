apis:
  - aid: getresponse:rest-api
    name: GetResponse API v3
    description: >-
      JSON REST API for managing contacts, campaigns, newsletters,
      autoresponders, landing pages, webinars, custom fields, tags,
      segments, and workflows in the GetResponse platform. Authentication
      uses an X-Auth-Token header carrying a personal API key.
    humanURL: https://apireference.getresponse.com/
    baseURL: https://api.getresponse.com/v3
    tags:
