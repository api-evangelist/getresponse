  - target: $.info
    update:
      x-apievangelist-idempotency:
        supported: false
        note: >-
          No Idempotency-Key header or equivalent anywhere in the spec or docs. Writes are not
          safe to blind-retry; error code 1008 (409, duplicate unique property) is the only
          deduplication signal and only where a natural unique constraint exists.
  - target: $.info
    update:
      x-apievangelist-error-model:
        rfc9457: false
        envelope: ErrorResponse
        discriminator: code
        note: >-
          The numeric `code` field, not the HTTP status, identifies the failure. One HTTP 400
          carries sixteen distinct codes. Auth failure is documented as 403/1014 but declared as
          401 in this spec.
  - target: $.info
    update:
      x-apievangelist-pagination:
        style: page-number
        request: [page, perPage]
        response_headers: [CurrentPage, TotalPages, TotalCount]
        note: Pagination state is in response headers, not in the JSON body.
  - target: $.info
    update:
      x-apievangelist-query-encoding: >-
        Filter parameters use a bracketed object form — query[field], sort[field] — whose
        brackets MUST be percent-encoded on the wire (query%5Bfield%5D). The provider's own
        published Agent Skill calls unencoded brackets the most common cause of spurious 400s.
  - target: $.components.securitySchemes.oauth2
    update:
      x-apievangelist-scope-model: >-
        Single scope "all" across every flow — full read and write over the whole account. A
