      summary: Update tax
      description: '

        Update the properties of the shop tax. You should only send the fields that need to be changed. The rest of the properties will stay the same.

        '
      operationId: updateTax
      requestBody:
        $ref: '#/components/requestBodies/UpdateTax'
      responses:
