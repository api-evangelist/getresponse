  /addresses:
    get:
      tags:
      - Addresses
      summary: Get a list of addresses
      description: 'Sending a **GET** request to this URL returns collection of address resources.


        You can narrow down the list of resources by passing proper query parameters (the list of which you can find below in the request params section). You can basically search by:

        * name

        * firstName

        * lastName

        * address1

        * address2

        * city

        * zip

        * province

        * provinceCode

        * phone

        * company

        * createdOn


        The `name` field can be a pattern and we''ll try to match this phrase.


        You can specify which page of the results you want and how many results per page to display. You can also specify the sort-order using one or more of the allowed fields (listed below in the request params section).


        Last but not least, you can even specify which fields from a resource you want to get. If you pass the param `fields` with the list of fields (separated by a comma [,]) we''ll return the list of resources with only those fields (we''ll always add a resource ID to ensure that you can use that data later on)

        You can filter the resource using criteria specified as `query[*]`. You can provide multiple criteria, to use AND logic. You can sort the resource using parameters specified as `sort[*]`. You can specify multiple fields to sort by.'
      operationId: getAddressList
      parameters:
      - name: query[name]
        in: query
        description: Search addresses by name
        required: false
        schema:
          type: string
      - name: query[firstName]
        in: query
        description: Search addresses by first name
        required: false
        schema:
          type: string
      - name: query[lastName]
        in: query
        description: Search addresses by last name
        required: false
        schema:
          type: string
      - name: query[address1]
        in: query
        description: Search addresses by address1 field
        required: false
        schema:
          type: string
      - name: query[address2]
        in: query
        description: Search addresses by address2 field
        required: false
        schema:
          type: string
      - name: query[city]
        in: query
        description: Search addresses by city
        required: false
        schema:
          type: string
      - name: query[zip]
        in: query
        description: Search addresses by ZIP
        required: false
        schema:
          type: string
      - name: query[province]
        in: query
        description: Search addresses by province
        required: false
        schema:
          type: string
      - name: query[provinceCode]
        in: query
        description: Search addresses by province code
        required: false
        schema:
          type: string
      - name: query[phone]
        in: query
        description: Search addresses by phone
        required: false
        schema:
          type: string
      - name: query[company]
        in: query
        description: Search addresses by company
        required: false
        schema:
          type: string
      - name: query[createdOn][from]
        in: query
        description: Search addresses created from this date
        required: false
        schema:
          type: string
          format: date-time
      - name: query[createdOn][to]
        in: query
        description: Search addresses created to this date
        required: false
        schema:
          type: string
          format: date-time
      - name: sort[createdOn]
        in: query
        description: Sort by date
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/AddressList'
        '400':
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    httpStatus: 400
                    code: 1000
                    codeDescription: General error of validation process, more details should be in context section
                    message: Validation error, see context section for more information
                    moreInfo: https://apidocs.getresponse.com/en/v3/errors/1000
                    context:
                      validationType: searchFilter[query]
                      fieldName: name
                      originalName: lorem-ipsum
                      errorDescription: Not allowed search field
                    uuid: 77dabfd1-1fa7-4f9f-8d3f-487b4403e3aa
        '401':
