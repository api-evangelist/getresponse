      summary: Get newsletter activities
      description: "**DEPRECATED**: This method is deprecated and scheduled for removal. To synchronise newsletter activities please use [custom reports](https://apireference.getresponse.com/#operation/createCustomReport) with type `message_activity_reports`. This is the preferred approach due to better performance. \n\n By default, activities from the **last 14 days** are listed only. You can get activities for last 30 days only. You can filter the resource using criteria specified as `query[*]`. You can provide multiple criteria, to use AND logic. You can sort the resource using parameters specified as `sort[*]`. You can specify multiple fields to sort by."
      operationId: getNewsletterActivities
      parameters:
      - name: query[activity]
        in: query
        description: Search newsletter activities by activity type
        required: false
        schema:
          type: string
          enum:
          - send
          - open
          - click
      - name: query[createdOn][from]
        in: query
        description: Search newsletter activities from this date. Default value is 14 days earlier. You can get activities for last 30 days only.
        required: false
