components:
  requestBodies:
    SendNewsletterDraft:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SendNewsletterDraft'
    NewNewsletter:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewNewsletter'
  schemas:
    SortOrderEnum:
      type: string
      enum:
      - ASC
      - DESC
    CampaignReference:
      required:
      - campaignId
      properties:
        campaignId:
          description: Campaign ID
          type: string
          example: C
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/campaigns/C
        name:
          description: The campaign name
          type:
          - string
          - 'null'
          readOnly: true
          example: Promo campaign
      type: object
    NewsletterActivity:
      properties:
        activity:
          description: The type of activity
          type: string
          enum:
          - send
          - open
          - click
        createdOn:
          description: The date when activity occurred
          type: string
          format: date-time
          example: 2019-10-21T11:08:45+0000
        contact:
          description: The contact ID
          allOf:
          - $ref: '#/components/schemas/NewsletterActivityContactReference'
      type: object
    MessageFlagsString:
      description: 'Comma-separated list of message flags. The possible values are: `openrate`, `clicktrack`, and `google_analytics`.'
      type: string
      example: clicktrack,google_analytics
    TimeZone:
      required:
      - timeZoneId
      properties:
        timeZoneId:
          description: 'Time zone ID: [Link to resource](https://apireference.getresponse.com/#operation/getTimezones)'
          type: integer
          example: 282
      type: object
    NewsletterActivityContactReference:
      properties:
        contactId:
          description: 'Unique identifier of the contact. You can retrieve this ID from the [list of contacts](https://apireference.getresponse.com/#operation/getContactList) field: contactId'
          type: string
          example: pV3r
        email:
          description: The contact email
          type: string
          example: contact@domain.com
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          example: https://api.getresponse.com/v3/contacts/pV3r
      type: object
    MessageEditorEnum:
      description: 'Indicates how the message was created: `custom` means a custom-made message, `text` means plain text content, `getresponse` means that the message was created using the GetResponse editor.'
      type: string
      enum:
      - custom
      - text
      - getresponse
      - legacy
      - html2
    FromFieldReference:
      required:
      - fromFieldId
      properties:
        fromFieldId:
          description: The 'From' address ID
          type: string
          example: V
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/from-fields/V
      type: object
    ExternalLexpad:
      description: 'External Lexpad settings for the message, read more: [External Lexpad](https://apidocs.getresponse.com/v3/dynamic-content/external-lexpad)'
      required:
      - dataSourceUrl
      properties:
        dataSourceUrl:
          description: URL to the endpoint that will provide data for External Lexpad
          type: string
          format: uri
          maxLength: 2048
          minLength: 1
          example: https://example.com/external_lexpad
        dataSourceToken:
          description: Token that will be sent in `X-Auth-Token` header to authenticate the requests made to the endpoint
          type:
          - string
          - 'null'
          maxLength: 255
          minLength: 0
          example: cf4dfca78434bf927a7655c0c4d95a2a45c33b71
      type: object
    StringBooleanEnum:
      type: string
      enum:
      - 'true'
      - 'false'
    Newsletter:
      required:
      - newsletterId
      - href
      properties:
        newsletterId:
          description: The newsletter ID
          type: string
          readOnly: true
          example: N
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/newsletters/N
        name:
          description: The newsletter name
          type: string
          maxLength: 128
          minLength: 2
          example: New message
        type:
          description: The newsletter type
          type: string
          default: broadcast
          enum:
          - broadcast
          - draft
        status:
          description: The newsletter status
          readOnly: true
          example: enabled
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
        editor:
          description: This describes how the content of the message was created
          allOf:
          - $ref: '#/components/schemas/MessageEditorEnum'
        subject:
          description: The message subject
          type: string
          maxLength: 128
          minLength: 2
          example: Annual report
        fromField:
          description: The 'From' email address used for the message
          allOf:
          - $ref: '#/components/schemas/FromFieldReference'
        replyTo:
          description: The email that will be used as the reply-to address
          allOf:
          - $ref: '#/components/schemas/FromFieldReference'
        campaign:
          description: The newsletter must be assigned to a campaign
          allOf:
          - $ref: '#/components/schemas/CampaignReference'
        sendOn:
          description: The scheduled send date and time for the newsletter in the ISO 8601 format.
          type: string
          format: date-time
          readOnly: true
        attachments:
          description: The newsletter attachments. The size of all attachments combined can't exceed 400KB
          type: array
          items:
            $ref: '#/components/schemas/NewsletterAttachment'
        sendSettings:
          description: How the message will be delivered to the subscriber. You can specify multiple parameters. Then the system uses AND logic.
          allOf:
          - $ref: '#/components/schemas/NewsletterSendSettingsDetails'
        sendMetrics:
          description: The sending metrics
          type: object
          readOnly: true
          allOf:
          - properties:
              status:
                type: string
                default: finished
                enum:
                - scheduled
                - in_progress
                - finished
              sent:
                description: Messages already sent
                type: string
                example: '100'
              total:
                description: The total amount of messages to send
                type: string
                example: '200'
              delivered:
                description: The amount of delivered messages
                type: string
                example: '99'
              openRate:
                description: The ratio of unique opens to delivered messages
                type: string
                example: '0.02'
              clickRate:
                description: The ratio of unique link clicks to delivered messages
                type: string
                example: '0.01'
              humanOpenRate:
                description: The ratio of unique human opens to delivered messages
                type: string
                example: '0.12'
              humanClickRate:
                description: The ratio of unique human link clicks to delivered messages
                type: string
                example: '0.13'
            type: object
        createdOn:
          description: The creation date
          type: string
          format: date-time
          readOnly: true
      type: object
    DateOrDateTime:
      oneOf:
      - type: string
        format: date
        example: '2018-04-15'
      - type: string
        format: date-time
        example: 2018-01-15T13:30:42+0000
    MessageContent:
      description: The message content.
      properties:
        html:
          description: The message content in HTML
          type: string
          maxLength: 524288
          example: <h1>test 12</h1><p>Some test <a href="http://example.com">http://example.com</a></p>
        plain:
          description: The plain text equivalent of the message content
          type: string
          maxLength: 524288
          example: test 12 Some test
      type: object
    NewsletterSendSettingsDetails:
      properties:
        selectedCampaigns:
          description: The list of selected campaigns
          type: array
          items:
            type: string
            example: V
        selectedSegments:
          description: The list of selected segments
          type: array
          items:
            type: string
            example: S
        selectedSuppressions:
          description: The list of selected suppressions (suppressions exclude contacts)
          type: array
          items:
            type: string
            example: Se
        excludedCampaigns:
          description: The list of excluded campaigns
          type: array
          items:
            type: string
            example: O
        excludedSegments:
          description: The list of excluded segments
          type: array
          items:
            type: string
            example: R
        selectedContacts:
          description: The list of selected contacts
          type: array
          items:
            type: string
            example: Qs
        timeTravel:
          description: Use the time travel functionality. This means that the system will match the scheduled sending hour for the message to the time zone of each recipient. As a result, sending may take up to 24 hours.
          example: 'true'
          allOf:
          - $ref: '#/components/schemas/StringBooleanEnum'
        perfectTiming:
          description: Use the perfect timing functionality
          example: 'false'
          allOf:
          - $ref: '#/components/schemas/StringBooleanEnum'
        externalLexpad:
          description: 'External Lexpad settings for the message, read more: [External Lexpad](https://apidocs.getresponse.com/v3/dynamic-content/external-lexpad)'
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/ExternalLexpad'
        sendOn:
          description: The scheduled send date and time for the newsletter. **Please note:** To send your message immediately, omit the `sendOn` section
          required:
          - date
          - timeZone
          properties:
            date:
              description: The scheduled send date and time for the newsletter in the ISO 8601 format
              type: string
              format: date-time
              example: '2024-07-14T07:00:00'
            timeZone:
              description: The time zone in which the newsletter is to be sent
              type: object
              allOf:
              - $ref: '#/components/schemas/TimeZone'
          type: object
          writeOnly: true
      type: object
    NewsletterAttachment:
      properties:
        fileName:
          description: The file name
          type: string
          example: some_file.jpg
        content:
          description: The base64 encoded file content
          type: string
          format: byte
          example: sdfadsfetsdjfdskafdsaf==
        mimeType:
          description: The file mime type
          type: string
          example: image/jpeg
      type: object
    NewNewsletter:
      required:
      - subject
      - fromField
      - campaign
      - content
      - sendSettings
      properties:
        content:
          $ref: '#/components/schemas/MessageContent'
        flags:
          $ref: '#/components/schemas/MessageFlagsArray'
        trackOpens:
          description: Enables open tracking for the message. When true, message opens are tracked; when false, they are not. Defaults to true when omitted.
          example: 'true'
          allOf:
          - $ref: '#/components/schemas/StringBooleanEnum'
        name:
          description: The newsletter name
          type: string
          maxLength: 128
          minLength: 2
          example: New message
        type:
          description: The newsletter type
          type: string
          default: broadcast
          enum:
          - broadcast
          - draft
        subject:
          description: The message subject
          type: string
          maxLength: 128
          minLength: 2
          example: Annual report
        fromField:
          description: The 'From' email address used for the message
          allOf:
          - $ref: '#/components/schemas/FromFieldReference'
        replyTo:
          description: The email that will be used as the reply-to address
          allOf:
          - $ref: '#/components/schemas/FromFieldReference'
        campaign:
          description: The newsletter must be assigned to a campaign
          allOf:
          - $ref: '#/components/schemas/CampaignReference'
        attachments:
          description: The newsletter attachments. The size of all attachments combined can't exceed 400KB
          type: array
          items:
            $ref: '#/components/schemas/NewsletterAttachment'
        sendSettings:
          description: How the message will be delivered to the subscriber. You can specify multiple parameters. Then the system uses AND logic.
          allOf:
          - $ref: '#/components/schemas/NewsletterSendSettingsDetails'
      type: object
    SendNewsletterDraft:
      required:
      - messageId
      - sendSettings
      properties:
        messageId:
          description: The message identifier (equals to newsletterId)
          type: string
          example: N
        sendSettings:
          description: How the message will be delivered to the subscriber
          allOf:
          - $ref: '#/components/schemas/NewsletterSendSettingsDetails'
      type: object
    StatusEnum:
      type: string
