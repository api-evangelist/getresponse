                    codeDescription: Too many request to API, quota reached, please wait till next quota
                      window
                    message: You have reached your requests limit for this time window, please wait...
                    moreInfo: https://apidocs.getresponse.com/en/v3/errors/1015
                    context:
                      currentLimit: 30000
                      timeToReset: 100 seconds
                    uuid: 510c6726-7f65-46b7-a798-ca403133924f
      security:
      - api-key: []
      - oauth2:
        - all
    parameters:
    - $ref: '#/components/parameters/shopId'
    post:
      tags:
      - Orders
      summary: Create order
      description: '

        Sending a **POST** request to this URL will create a new order resource.


        In order to create a new order, you need to send the order resource in the body of the request
        (remember that you need to serialize the body into a JSON string).


        '
      operationId: createOrder
      parameters:
      - name: additionalFlags
        in: query
        description: The additional flags parameter with the value `skipAutomation` will skip the triggering
          `Make a purchase` element in an automated workflow
        required: false
        schema:
          type: string
        example: skipAutomation
        x-set:
        - skipAutomation
      requestBody:
        $ref: '#/components/requestBodies/NewOrder'
      responses:
        '201':
          $ref: '#/components/responses/OrderDetails'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    httpStatus: 404
                    code: 1013
                    codeDescription: The requested resource was not found
                    message: Resource not found
                    moreInfo: https://apidocs.getresponse.com/en/v3/errors/1013
