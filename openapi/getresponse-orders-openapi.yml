    post:
      tags:
      - Orders
      summary: Update order
      description: '

        Update the properties of a shop''s order. You should send only those fields that need to be changed.
        The rest of the properties will stay the same.

        However, in case of `billingAddress` and `shippingAddress`, you must send the entire representation.
        Individual fields can''t be updated.

        If you want to update individual fields of an address, you can do so using `POST /v3/addresses/{addressId}`.


        In case of `selectedVariants`, when the collection is updated, the old collection is completely
        removed. The same goes for meta fields.

        Individual fields can''t be updated either. The full representations of `selectedVariants` and
        `metaFields` must be sent instead.


        '
      operationId: updateOrder
      parameters:
      - name: additionalFlags
        in: query
        description: The additional flags parameter with the value `skipAutomation` will skip the triggering
          `Make a purchase` element in an automated workflow
        required: false
