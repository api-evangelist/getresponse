tags:
- name: Orders
  description: Orders API documentation
paths:
  /shops/{shopId}/orders:
    get:
      tags:
      - Orders
      summary: Get the list of orders
      description: "\nSending a  **GET** request to this URL returns a collection of order resources that\
        \ belong to the given shop.\n\nYou can narrow down the list of resources by passing proper query\
        \ parameters (the list of which you can find below in the request params section). You can basically\
        \ search by:\n * description\n * status\n * externalId\n * processedAt\n\nThe `description` fields\
        \ can be a pattern and we'll try to match this phrase.\n\n You can filter the resource using criteria\
        \ specified as `query[*]`. You can provide multiple criteria, to use AND logic. You can sort the\
        \ resource using parameters specified as `sort[*]`. You can specify multiple fields to sort by."
      operationId: getOrderList
      parameters:
      - name: query[description]
        in: query
        description: Search order by description
        required: false
        schema:
          type: string
      - name: query[status]
        in: query
        description: Search order by status
        required: false
        schema:
          type: string
      - name: query[externalId]
        in: query
        description: Search order by external ID
        required: false
        schema:
          type: string
      - name: query[processedAt][from]
        in: query
        description: Show orders processed from this date
        required: false
        schema:
          type: string
          format: date-time
      - name: query[processedAt][to]
        in: query
        description: Show orders processed to this date
        required: false
        schema:
          type: string
          format: date-time
      - name: sort[createdOn]
        in: query
        description: Sort by date
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/OrderList'
        '400':
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    httpStatus: 400
                    code: 1000
                    codeDescription: General error of validation process, more details should be in context
                      section
                    message: Validation error, see context section for more information
                    moreInfo: https://apidocs.getresponse.com/en/v3/errors/1000
                    context:
                      validationType: searchFilter[query]
                      fieldName: name
                      originalName: lorem-ipsum
                      errorDescription: Not allowed search field
                    uuid: 77dabfd1-1fa7-4f9f-8d3f-487b4403e3aa
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    httpStatus: 401
                    code: 1014
                    codeDescription: Problem during authentication process, check headers!
                    message: Unable to authenticate request. Check credentials or authentication method
                      details
                    moreInfo: https://apidocs.getresponse.com/en/v3/errors/1014
                    context:
                      authenticationType: auth_token
                    uuid: 62417847-4f12-4c25-9b3a-0b619a187efe
        '429':
          description: The throttling limit has been reached
