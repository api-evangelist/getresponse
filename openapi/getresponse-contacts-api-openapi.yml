components:
  schemas:
    SortOrderEnum:
      type: string
      enum:
      - ASC
      - DESC
    CampaignReference:
      required:
      - campaignId
      properties:
        campaignId:
          description: Campaign ID
          type: string
          example: C
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/campaigns/C
        name:
          description: The campaign name
          type:
          - string
          - 'null'
          readOnly: true
          example: Promo campaign
      type: object
    ContactActivityResource:
      properties:
        resourceId:
          type:
          - string
          - 'null'
          example: oY2n
        resourceType:
          type: string
          enum:
          - newsletters
          - splittests
          - autoresponders
          - rss-newsletters
          - sms
          example: newsletters
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          example: https://api.getresponse.com/v3/newsletters/oY2n
      type: object
    NewContactCustomFieldValues:
      properties:
        customFieldValues:
          type: array
          items:
            $ref: '#/components/schemas/NewContactCustomFieldValue'
      type: object
    ContactCustomFieldList:
      type: array
      items:
        $ref: '#/components/schemas/ContactCustomField'
    UpsertContactCustomFields:
      required:
      - customFieldValues
      type: object
      allOf:
      - $ref: '#/components/schemas/NewContactCustomFieldValues'
    ContactActivityClickTrack:
      properties:
        id:
          description: The click tracking ID
          type: string
          example: 62WrE
        name:
          description: The name of the clicked link
          type: string
          example: Go to shop
        url:
          description: The URL of the clicked link
          type: string
          format: uri
          example: https://my-shop.example.com/
      type: object
    NewContact:
      required:
      - email
      - campaign
      type: object
      allOf:
      - properties:
          ipAddress:
            description: The contact's IP address. IPv4 and IPv6 formats are accepted.
            example: 1.2.3.4
            oneOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv6
        type: object
      - $ref: '#/components/schemas/Contact'
      - $ref: '#/components/schemas/NewContactTags'
      - $ref: '#/components/schemas/NewContactCustomFieldValues'
    NewContactCustomFieldValue:
      required:
      - customFieldId
      - value
      properties:
        customFieldId:
          description: Custom field ID
          type: string
          example: kL6Nh
        value:
          type: array
          items:
            type: string
            example: 18-35
      type: object
    DateOrDateTime:
      oneOf:
      - type: string
        format: date
        example: '2018-04-15'
      - type: string
        format: date-time
        example: 2018-01-15T13:30:42+0000
    NewContactTag:
      required:
      - tagId
      properties:
        tagId:
          type: string
          example: m7E2
      type: object
    ContactListElement:
      allOf:
      - properties:
          note:
            type:
            - string
            - 'null'
            maxLength: 255
            minLength: 0
          ipAddress:
            description: The contact's IP address. IPv4 and IPv6 formats are accepted.
            example: 1.2.3.4
            oneOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv6
        type: object
      - $ref: '#/components/schemas/Contact'
    UpsertContactTags:
      required:
      - tags
      type: object
      allOf:
      - $ref: '#/components/schemas/NewContactTags'
    UpdateContact:
      type: object
      allOf:
      - properties:
          contactId:
            type: string
            readOnly: true
            example: pV3r
          name:
            type: string
            maxLength: 128
            minLength: 1
            example: John Doe
          origin:
            type: string
            enum:
            - import
            - email
            - www
            - panel
            - leads
            - sale
            - api
            - survey
            - iphone
            - copy
            - landing_page
            - webinar
            - website_builder_elegant
            - chat
            - course
            - premium_newsletter
            readOnly: true
          timeZone:
            description: The time zone of a contact, uses the time zone database format (https://www.iana.org/time-zones)
            type: string
            readOnly: true
            example: Europe/Warsaw
          activities:
            type: string
            format: uri
            readOnly: true
            example: https://api.getresponse.com/v3/contacts/pV3r/activities
          changedOn:
            type: string
            format: date-time
            readOnly: true
            example: 2017-12-19T13:11:48+0000
          createdOn:
            type: string
            format: date-time
            readOnly: true
            example: 2017-03-02T07:30:49+0000
          campaign:
            type: object
            allOf:
            - properties:
                campaignId:
                  description: Campaign ID
                  type: string
                  example: C
                href:
                  description: Direct hyperlink to a resource
                  type: string
                  format: uri
                  readOnly: true
                  example: https://api.getresponse.com/v3/campaigns/C
                name:
                  description: The campaign name
                  type:
                  - string
                  - 'null'
                  readOnly: true
                  example: Promo campaign
              type: object
          email:
            type: string
            format: email
            example: john.doe@example.com
          dayOfCycle:
            description: The day on which the contact is in the Autoresponder cycle. `null` indicates the contacts is not in the cycle.
            type:
            - string
            - 'null'
            example: '42'
          scoring:
            description: Contact scoring, pass null to remove the score from a contact
            type:
            - number
            - 'null'
            example: 8
          engagementScore:
            description: Engagement Score is a feature that presents a visual estimate of a contact's engagement with mailings. The score is based on the contact's interactions with your e-mails. Via API, it's returned in the form of numbers ranging from 1 (Not Engaged) to 5 (Highly Engaged).
            type:
            - integer
            - 'null'
            format: int32
            maximum: 5
            minimum: 1
            readOnly: true
            example: 3
          href:
            description: Direct hyperlink to a resource
            type: string
            format: uri
            readOnly: true
            example: https://api.getresponse.com/v3/contacts/pV3r
          note:
            type:
            - string
            - 'null'
            maxLength: 255
            minLength: 0
        type: object
      - $ref: '#/components/schemas/NewContactTags'
      - $ref: '#/components/schemas/NewContactCustomFieldValues'
    NewContactTags:
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/NewContactTag'
      type: object
    ContactConsentHistoryItem:
      properties:
        content:
          description: The text content of the consent field.
          type: string
          example: I agree to receive marketing emails.
        wasGranted:
          description: Information whether the consent field was granted.
          type: boolean
          example: true
        declaredAt:
          description: The date and time when the consent field status was declared by the contact (ISO 8601).
          type: string
          format: date-time
          example: 2024-07-20T06:24:14+0000
        createdAt:
          description: The date and time when this consent field version was created (ISO 8601).
          type: string
          format: date-time
          example: 2024-07-20T06:24:14+0000
      type: object
    ContactGeolocation:
      properties:
        latitude:
          type:
          - string
          - 'null'
          example: '54.35'
        longitude:
          type:
          - string
          - 'null'
          example: '18.6667'
        continentCode:
          type:
          - string
          - 'null'
          enum:
          - OC
          - AN
          - SA
          - NA
          - AS
          - EU
          - AF
          example: EU
        countryCode:
          description: The country code, compliant with ISO 3166-1 alpha-2
          type:
          - string
          - 'null'
          example: PL
        region:
          type:
          - string
          - 'null'
          example: '82'
        postalCode:
          type:
          - string
          - 'null'
          example: 80-387
        dmaCode:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
          example: Gdansk
      type: object
    ContactCustomFieldValue:
      required:
      - customFieldId
      - name
      - type
      - value
      - values
      properties:
        customFieldId:
          description: Custom field ID
          type: string
          example: 4klkN
        name:
          type: string
          example: age
        value:
          type: array
          items:
            type: string
            example: 18-35
        values:
          type: array
          items:
            type: string
            example: 18-35
        type:
          type: string
          example: single_select
        fieldType:
          type: string
          example: single_select
        valueType:
          type: string
          example: string
      type: object
    ContactActivity:
      properties:
        activity:
          description: The type of activity
          type: string
          enum:
          - send
          - open
          - click
          example: click
        subject:
          type: string
          example: Shop offer update!
        createdOn:
          description: The activity date
          type: string
          format: date-time
        previewUrl:
          description: This is only available for the `send` activity. It includes a link to the message preview
          type:
          - string
          - 'null'
          format: uri
          example: https://www.grnewsletters.com/archive/campaign_name55f6b0ff01/Test-2135303.html
        resource:
          $ref: '#/components/schemas/ContactActivityResource'
        clickTrack:
          description: This is only available for the `click` activity. It includes the clicked link data
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/ContactActivityClickTrack'
      type: object
      readOnly: true
    ContactCustomField:
      properties:
        customFieldId:
          type: string
          example: kL6Nh
        values:
          type: array
          items:
            type: string
            example: 18-35
      type: object
    ContactDetails:
      type: object
      allOf:
      - properties:
          geolocation:
            $ref: '#/components/schemas/ContactGeolocation'
          tags:
            description: The list of contact tags, limited to 500 tags.
            type: array
            items:
              $ref: '#/components/schemas/ContactTag'
          customFieldValues:
            type: array
            items:
              $ref: '#/components/schemas/ContactCustomFieldValue'
        type: object
      - $ref: '#/components/schemas/ContactListElement'
    ContactTag:
      properties:
        tagId:
          type: string
          example: hR
        name:
          type: string
          example: super_promo
        href:
          type: string
          format: uri
          example: https://api.getresponse.com/v3/tags/hR
        color:
          type: string
          example: ''
          deprecated: true
      type: object
    ErrorResponse:
      required:
      - httpStatus
      - code
      - codeDescription
      - message
      - moreInfo
      - context
      - uuid
      properties:
        httpStatus:
          description: HTTP response code
          type: integer
          format: int32
        code:
          description: API error code
          type: integer
          format: int32
        codeDescription:
          description: API error code description
          type: string
        message:
          description: Error message
          type: string
        moreInfo:
          description: URL to error description in the API Docs
          type: string
        context:
          type: object
        uuid:
          description: UUID of the error response
          type: string
      type: object
    Contact:
      required:
      - contactId
      - href
      - email
      properties:
        contactId:
          type: string
          readOnly: true
          example: pV3r
        name:
          type: string
          maxLength: 128
          minLength: 1
          example: John Doe
        origin:
          type: string
          enum:
          - import
          - email
          - www
          - panel
          - leads
          - sale
          - api
          - survey
          - iphone
          - copy
          - landing_page
          - webinar
          - website_builder_elegant
          - chat
          - course
          - premium_newsletter
          readOnly: true
        timeZone:
          description: The time zone of a contact, uses the time zone database format (https://www.iana.org/time-zones)
          type: string
          readOnly: true
          example: Europe/Warsaw
        activities:
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/contacts/pV3r/activities
        changedOn:
          type: string
          format: date-time
          readOnly: true
          example: 2017-12-19T13:11:48+0000
        createdOn:
          type: string
          format: date-time
          readOnly: true
          example: 2017-03-02T07:30:49+0000
        campaign:
          $ref: '#/components/schemas/CampaignReference'
        email:
          type: string
          format: email
          example: john.doe@example.com
        dayOfCycle:
          description: The day on which the contact is in the Autoresponder cycle. `null` indicates the contacts is not in the cycle.
          type:
          - string
          - 'null'
          example: '42'
        scoring:
          description: Contact scoring, pass null to remove the score from a contact
          type:
          - number
          - 'null'
          example: 8
        engagementScore:
          description: Engagement Score is a feature that presents a visual estimate of a contact's engagement with mailings. The score is based on the contact's interactions with your e-mails. Via API, it's returned in the form of numbers ranging from 1 (Not Engaged) to 5 (Highly Engaged).
          type:
          - integer
          - 'null'
          format: int32
          maximum: 5
          minimum: 1
          readOnly: true
          example: 3
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/contacts/pV3r
      type: object
    ContactConsent:
      properties:
        consentId:
          description: The unique identifier of the consent field.
          type: string
          readOnly: true
          example: 8J3k
        name:
          description: The name of the consent field.
          type: string
          example: Marketing Consent
        content:
          description: The actual text content of the consent field.
          type: string
          example: I agree to receive marketing emails and SMS messages.
        isGranted:
          description: Information whether the consent field is currently granted (true) or not (false).
          type: boolean
          example: true
        history:
          description: The history of changes to the consent field text.
          type: array
          items:
            $ref: '#/components/schemas/ContactConsentHistoryItem'
      type: object
  headers:
    TotalPages:
      description: The total number of pages
      schema:
        type: integer
        format: int32
    CurrentPage:
      description: The current page number
      schema:
        type: integer
        format: int32
    RateLimitRemaining:
      description: The number of requests left in the current time frame
      schema:
        type: integer
        format: int32
    TotalCount:
      description: The total number of resources found for the specified conditions
      schema:
        type: integer
        format: int32
    RateLimitLimit:
      description: The total number of requests available per time frame
      schema:
        type: integer
        format: int32
    RateLimitReset:
      description: Seconds left in the current time frame, e.g. "432 seconds"
      schema:
        type: string
  parameters:
    PerPage:
      name: perPage
      in: query
