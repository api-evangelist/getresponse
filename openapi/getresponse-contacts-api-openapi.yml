  /contacts:
    get:
      tags:
      - Contacts
      summary: Get contact list
      description: You can filter the resource using criteria specified as `query[*]`. You can provide multiple criteria, to use AND logic. You can sort the resource using parameters specified as `sort[*]`. You can specify multiple fields to sort by.
      operationId: getContactList
      parameters:
      - name: query[email]
        in: query
        description: Search contacts by email
        required: false
        schema:
          type: string
      - name: query[name]
        in: query
        description: Search contacts by name
        required: false
        schema:
          type: string
      - name: query[campaignId]
        in: query
        description: Search contacts by campaign ID
        required: false
        schema:
          type: string
      - name: query[origin]
        in: query
        description: Search contacts by origin
        required: false
        schema:
          type: string
          enum:
          - import
          - email
          - www
          - panel
          - leads
          - sale
          - api
          - survey
          - iphone
          - copy
          - landing_page
          - webinar
          - website_builder_elegant
          - chat
          - course
          - premium_newsletter
      - name: query[createdOn][from]
        in: query
        description: Return only contacts created on or after the given date. Use ISO 8601 format
        required: false
        schema:
          $ref: '#/components/schemas/DateOrDateTime'
      - name: query[createdOn][to]
        in: query
        description: Return only contacts created on or before the given date. Use ISO 8601 format
        required: false
        schema:
          $ref: '#/components/schemas/DateOrDateTime'
      - name: query[changedOn][from]
        in: query
        description: Return only contacts whose data was changed on or after the given date. Use ISO 8601 format
        required: false
        schema:
          $ref: '#/components/schemas/DateOrDateTime'
      - name: query[changedOn][to]
        in: query
        description: Return only contacts whose data was changed on or before the given date. Use ISO 8601 format
        required: false
        schema:
          $ref: '#/components/schemas/DateOrDateTime'
      - name: sort[email]
        in: query
        description: Sort by email
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - name: sort[name]
        in: query
        description: Sort by name
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - name: sort[createdOn]
        in: query
        description: Sort contacts by subscription date
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - name: sort[changedOn]
