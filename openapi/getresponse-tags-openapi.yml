  /tags:
    get:
      tags:
      - Tags
      summary: Get the list of tags
      description: Provides a list of tags. You can filter the resource using criteria specified as `query[*]`.
        You can provide multiple criteria, to use AND logic. You can sort the resource using parameters
        specified as `sort[*]`. You can specify multiple fields to sort by.
      operationId: getTagsList
      parameters:
      - name: query[name]
        in: query
        description: Search tags by name
        required: false
        schema:
          type: string
      - name: query[createdAt][from]
        in: query
        description: Search tags created from this date
        required: false
        schema:
          $ref: '#/components/schemas/DateOrDateTime'
      - name: query[createdAt][to]
        in: query
        description: Search tags created to this date
        required: false
        schema:
          $ref: '#/components/schemas/DateOrDateTime'
      - name: sort[createdAt]
        in: query
        description: Sort tags by creation date
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - name: sort[name]
        in: query
        description: Sort by name
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
