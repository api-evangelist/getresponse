components:
  headers:
    CurrentPage:
      description: The current page number
      schema:
        type: integer
        format: int32
    RateLimitLimit:
      description: The total number of requests available per time frame
      schema:
        type: integer
        format: int32
    RateLimitRemaining:
      description: The number of requests left in the current time frame
      schema:
        type: integer
        format: int32
    RateLimitReset:
      description: Seconds left in the current time frame, e.g. "432 seconds"
      schema:
        type: string
    TotalCount:
      description: The total number of resources found for the specified conditions
      schema:
        type: integer
        format: int32
    TotalPages:
      description: The total number of pages
      schema:
        type: integer
        format: int32
  parameters:
    Fields:
      name: fields
      in: query
      description: List of fields that should be returned. Id is always returned. Fields should be separated
        by comma
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PerPage:
      name: perPage
      in: query
      description: Requested number of results per page
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        maximum: 1000
        minimum: 1
    tagId:
      name: tagId
      in: path
      description: The tag ID
      required: true
      schema:
        type: string
      example: vBd5
  requestBodies:
    NewTag:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewTag'
    UpdateTag:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateTag'
  responses:
    TagDetails:
      description: The tag details.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagDetails'
    TagList:
      description: The list of tags
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        CurrentPage:
          $ref: '#/components/headers/CurrentPage'
        TotalPages:
          $ref: '#/components/headers/TotalPages'
        TotalCount:
          $ref: '#/components/headers/TotalCount'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Tag'
  schemas:
    BaseTag:
      properties:
        name:
          description: The tag name
          type: string
          maxLength: 64
          minLength: 2
          pattern: ^[_a-zA-Z0-9]{2,64}$
          example: My_Tag
        color:
          description: The tag color (deprecated)
          type: string
          readOnly: true
          deprecated: true
      type: object
    DateOrDateTime:
      oneOf:
      - type: string
        format: date
        example: '2018-04-15'
      - type: string
        format: date-time
        example: 2018-01-15T13:30:42+0000
    ErrorResponse:
      required:
      - httpStatus
      - code
      - codeDescription
      - message
      - moreInfo
      - context
      - uuid
      properties:
        httpStatus:
          description: HTTP response code
          type: integer
          format: int32
        code:
          description: API error code
          type: integer
          format: int32
        codeDescription:
          description: API error code description
          type: string
        message:
          description: Error message
          type: string
        moreInfo:
          description: URL to error description in the API Docs
          type: string
        context:
          type: object
        uuid:
          description: UUID of the error response
          type: string
      type: object
    NewTag:
      required:
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseTag'
    SortOrderEnum:
      type: string
      enum:
      - ASC
      - DESC
    Tag:
      type: object
      allOf:
      - properties:
          tagId:
            description: The tag ID
            type: string
            readOnly: true
            example: vBd5
          href:
            description: The direct hyperlink to a resource
            type: string
            format: uri
            readOnly: true
            example: https://api.getresponse.com/v3/tags/vBd5
          createdAt:
            type: string
            format: date-time
            readOnly: true
            example: 2020-11-20T08:00:00+0000
      - $ref: '#/components/schemas/BaseTag'
    TagDetails:
      type: object
      allOf:
      - properties:
          tagId:
            description: The tag ID.
            type: string
            readOnly: true
          createdAt:
            type: string
            format: date-time
            readOnly: true
            example: 2024-07-20T06:24:14+0000
      - $ref: '#/components/schemas/BaseTag'
    UpdateTag:
      required:
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseTag'
  securitySchemes:
    api-key:
      type: apiKey
      description: Header value must be prefixed with api-key
      name: X-Auth-Token
      in: header
    oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.getresponse.com/oauth2_authorize.html
          scopes:
            all: all data access
        authorizationCode:
          authorizationUrl: https://app.getresponse.com/oauth2_authorize.html
          tokenUrl: https://api.getresponse.com/v3/token
          scopes:
            all: all data access
        clientCredentials:
          tokenUrl: https://api.getresponse.com/v3/token
          scopes:
            all: all data access
