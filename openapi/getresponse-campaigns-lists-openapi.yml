components:
  headers:
    CurrentPage:
      description: The current page number
      schema:
        type: integer
        format: int32
    RateLimitLimit:
      description: The total number of requests available per time frame
      schema:
        type: integer
        format: int32
    RateLimitRemaining:
      description: The number of requests left in the current time frame
      schema:
        type: integer
        format: int32
    RateLimitReset:
      description: Seconds left in the current time frame, e.g. "432 seconds"
      schema:
        type: string
    TotalCount:
      description: The total number of resources found for the specified conditions
      schema:
        type: integer
        format: int32
    TotalPages:
      description: The total number of pages
      schema:
        type: integer
        format: int32
  parameters:
    CampaignStatisticsDateFromQuery:
      name: query[createdOn][from]
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DateOrDateTime'
    CampaignStatisticsDateToQuery:
      name: query[createdOn][to]
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DateOrDateTime'
    CampaignStatisticsGroupByQuery:
      name: query[groupBy]
      in: query
      required: false
      schema:
        type: string
        enum:
        - hour
        - day
        - month
        - total
        example: month
    CampaignStatisticsIdQuery:
      name: query[campaignId]
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/CampaignStatisticsIdQuery'
    Fields:
      name: fields
      in: query
      description: List of fields that should be returned. Id is always returned. Fields should be separated
        by comma
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PerPage:
      name: perPage
      in: query
      description: Requested number of results per page
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        maximum: 1000
        minimum: 1
    campaignId:
      name: campaignId
      in: path
      description: 'Unique identifier of the campaign (contact list). You can retrieve this ID from the
        [list of campaigns](https://apireference.getresponse.com/#operation/getCampaignList) field: `campaignId`.'
      required: true
      schema:
        type: string
      example: 3Va2e
  requestBodies:
    NewCampaign:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewCampaign'
    UpdateCampaign:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateCampaign'
    UpdateCampaignBlocklist:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateBlocklist'
  responses:
    BalanceByDatesStatisticsList:
      description: The subscription statistics, shown by date.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BalanceByDatesStatisticsList'
    Campaign:
      description: The campaign data.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Campaign'
    CampaignBlocklist:
      description: Blocklist masks for the campaign.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Blocklist'
    CampaignList:
      description: The list of campaigns.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        CurrentPage:
          $ref: '#/components/headers/CurrentPage'
        TotalPages:
          $ref: '#/components/headers/TotalPages'
        TotalCount:
          $ref: '#/components/headers/TotalCount'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CampaignListElement'
    CampaignListSizesStatisticsList:
