      summary: Get a list of campaigns
      description: Returns a list of campaigns (contact lists). You can filter the resource using criteria
        specified as `query[*]`. You can provide multiple criteria, to use AND logic. You can sort the
        resource using parameters specified as `sort[*]`. You can specify multiple fields to sort by.
      operationId: getCampaignList
      parameters:
      - name: query[name]
        in: query
        description: Retrieve campaigns (contact lists) filtered by name
        required: false
        schema:
          type: string
          example: campaign_name
      - name: query[isDefault]
        in: query
        description: Retrieve campaigns (contact lists) depending on whether they are marked as default
          (`isDefault` = `true`)
        required: false
        schema:
          type: boolean
          example: true
      - name: sort[name]
        in: query
        description: Sort by name
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - name: sort[createdOn]
