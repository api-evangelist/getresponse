        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RemovalsByDatesStatisticsList'
    SubscriptionsByDatesStatisticsList:
      description: Subscription statistics by date
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubscriptionsByDatesStatisticsList'
  schemas:
    BalanceByDatesStatisticsList:
      type: array
      items:
        $ref: '#/components/schemas/CampaignBalanceStatisticsList'
    BaseCampaign:
      properties:
        campaignId:
          description: Unique identifier of the campaign (contact list)
          type: string
          readOnly: true
          example: V3J
        name:
          description: 'The campaign (list) name.


            * You can use each list name just once in your account.


            * The name must be between 3-64 characters.


            * All alphabets supported by GetResponse, including right-to-left ones, are allowed.


            * You can use upper and lower case letters, numbers, spaces and special characters apart from
            the ones listed below.


            * You can’t use emojis and the following special characters: `/`, `\`, `@`, and `[` or `]`.'
          type: string
          maxLength: 64
          minLength: 3
          example: my_campaign
        techName:
          description: Tech name is a unique internal ID of a list used for [FTP imports](https://www.getresponse.com/help/how-to-import-files-via-ftp.html)
            (available in GetResponse MAX accounts only)
          type: string
          readOnly: true
          example: my_campaign
        languageCode:
          description: 'The campaign language code according to ISO 639-1, plus: zt - Chinese (Traditional),
            fs - Afghan Persian (Dari), md - Moldavian'
          type: string
          example: EN
        isDefault:
          description: Is the campaign default
          example: 'true'
          allOf:
          - $ref: '#/components/schemas/StringBooleanEnum'
        createdOn:
          description: The date of creation
          type: string
          format: date-time
          readOnly: true
          example: 2014-02-12T15:19:21+0000
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/campaigns/V3J
      type: object
    Blocklist:
      properties:
        masks:
          type: array
          items:
            type: string
            example: jack@somedomain.com
      type: object
    Campaign:
      required:
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseCampaign'
      - $ref: '#/components/schemas/CampaignAdditionalProperties'
    CampaignAdditionalProperties:
      properties:
        postal:
          $ref: '#/components/schemas/CampaignPostal'
        confirmation:
          $ref: '#/components/schemas/CampaignConfirmation'
        optinTypes:
          $ref: '#/components/schemas/CampaignOptinTypes'
        subscriptionNotifications:
          $ref: '#/components/schemas/CampaignSubscriptionNotifications'
        profile:
          $ref: '#/components/schemas/CampaignProfile'
      type: object
    CampaignBalanceStatisticsList:
      type: object
      example:
        '2014-12-05':
          removals:
            user: 5
          subscriptions:
            import: 0
            email: 0
            www: 0
            panel: 0
            leads: 0
            sale: 0
            api: 7
            forward: 0
            survey: 0
            mobile: 0
            copy: 0
            landing_page: 0
            webinar: 4
            premium_newsletter: 1
            course: 1
            summary: 13
        '2015-01-21':
          removals:
            user: 10
      additionalProperties:
        description: Dates in YYYY-MM-DD format are used as keys
        anyOf:
        - properties:
            removals:
              type: object
              allOf:
              - $ref: '#/components/schemas/CampaignRemovalsStatisticsItem'
          type: object
        - properties:
            subscriptions:
              type: object
              allOf:
              - $ref: '#/components/schemas/CampaignSubscriptionStatisticsItem'
          type: object
    CampaignConfirmation:
      properties:
        fromField:
          $ref: '#/components/schemas/FromFieldReference'
        redirectType:
          description: 'What will happen after email confirmation. The values allowed include: hosted
            (the subscriber will stay on the default GetResponse website), customUrl (the subscriber will
            be redirected to a custom URL provided by the user).'
          type: string
          enum:
          - hosted
          - customUrl
          example: hosted
        mimeType:
          description: The MIME type for the confirmation message
          type: string
          enum:
          - text/html
          - text/plain
          - combo
          example: text/plain
        redirectUrl:
          description: Required if the redirectType is customUrl. The URL a subscriber will be redirected
            to if the redirectType is set to customUrl.
          type: string
          format: uri
          example: http://example.com
        replyTo:
          $ref: '#/components/schemas/FromFieldReference'
        subscriptionConfirmationBodyId:
          description: The subscription confirmation body ID
          type: string
          example: asS1
        subscriptionConfirmationSubjectId:
          description: Subscription confirmation subject ID
          type: string
          example: TEww
      type: object
    CampaignListElement:
      type: object
      allOf:
      - properties:
          description:
            description: It's the same as the campaign name, kept for compatibility reasons
            type: string
            readOnly: true
            example: my_campaign
      - $ref: '#/components/schemas/BaseCampaign'
    CampaignListSizesStatisticsElement:
      properties:
        totalSubscribers:
          description: The total amount of subscribers for a given datetime and grouping
          type: integer
          format: int64
        addedSubscribers:
          description: The amount of subscribers added since the previous statistics frame
          type: integer
          format: int64
        removedSubscribers:
          description: The amount of subscribers removed since the previous statistics frame
          type: integer
          format: int64
        createdOn:
          description: The statistics frame timestamp. The value depends on the groupBy parameter. For
            the hour, use datetime in the format YYYY-mm-dd HH:mm:ss; for the day, use date in the format
            YYYY-mm-dd; for the month, use a string in the format YYYY-mm; and for the total, use the
            string total.
          type: string
      type: object
    CampaignListSizesStatisticsList:
      type: array
      items:
        $ref: '#/components/schemas/CampaignListSizesStatisticsElement'
    CampaignLocationItem:
      type: object
      example:
        others:
          amount: '6'
          continentCode: ''
          countryCode: ''
        PL:
          amount: '45'
          continentCode: EU
          countryCode: PL
