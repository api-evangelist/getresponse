    - $ref: '#/components/parameters/productId'
    post:
      tags:
      - Product Variants
      summary: Create product variant
      description: '

        Sending a **POST** request to this URL will create a new product variant resource.


        In order to create a new product variant, you need to send a product variant resource in the body
        of the request (remember that you need to serialize the body into a JSON string)


        There is no need to create every element (like: image, meta field, tax) one by one by their own
        endpoints. All these elements can be created during this method.


        '
      operationId: createProductVariant
      requestBody:
        $ref: '#/components/requestBodies/NewProductVariant'
      responses:
        '201':
          $ref: '#/components/responses/ProductVariantDetails'
        '404':
