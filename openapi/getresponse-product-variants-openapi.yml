      summary: Update product variant
      description: "\nUpdate properties of a product variant. You should send only those fields that need\
        \ to be changed. The remaining properties will stay the same. However, when updating metafields,\
        \ images, and taxes, you need to send entire collections. Individual fields can't be updated.\
        \ If you want to update particular metafields or tax resources, you can do so using their particular\
        \ endpoints, i.e:\n\n * taxes - `POST /v3/shops/{shopId}/taxes/{taxId}`\n * metaFields - `POST\
        \ /v3/shops/{shopId}/meta-fields/{metaFieldId}`\n\n"
      operationId: updateProductVariant
      requestBody:
