  description: Product Variants API documentation
paths:
  /shops/{shopId}/products/{productId}/variants:
    get:
      tags:
      - Product Variants
      summary: Get a list of product variants
      description: '

        Sending a **GET** request to this URL returns a collection of product variant resources that belong
        to the given shop and product.


        You can narrow down the list of resources by passing proper query parameters (the list of which
        you can find below in the request params section). You can basically search by:

        * name

        * sku

        * description


        The `description` fields can be a pattern and we''ll try to match this phrase.


        '
      operationId: getProductVariantList
      parameters:
      - name: query[name]
        in: query
        description: Search variant by name
        required: false
        schema:
          type: string
      - name: query[sku]
        in: query
        description: Search variant by SKU
        required: false
        schema:
          type: string
      - name: query[description]
        in: query
        description: Search variant by description
        required: false
        schema:
          type: string
      - name: query[externalId]
        in: query
        description: Search variant by external ID
        required: false
        schema:
          type: string
      - name: query[createdAt][from]
        in: query
        description: Show variants starting from this date
        required: false
        schema:
          type: string
          format: date-time
      - name: query[createdAt][to]
        in: query
        description: Show variants starting to this date
        required: false
        schema:
          type: string
          format: date-time
      - name: sort[createdOn]
        in: query
        description: Sort by date
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderEnum'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/ProductVariantList'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    httpStatus: 404
                    code: 1013
                    codeDescription: The requested resource was not found
                    message: Resource not found
                    moreInfo: https://apidocs.getresponse.com/en/v3/errors/1013
                    context:
                      contactId: pVyRW
                    uuid: 87b90a96-5ee5-4ca4-8180-ac00adcf62c7
        '400':
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
