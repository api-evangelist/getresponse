      - name: query[tagId]
        in: query
        description: Search transactional emails with a specific tag ID
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          $ref: '#/components/responses/TransactionalEmailStatistics'
        '400':
