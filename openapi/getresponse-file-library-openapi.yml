components:
  headers:
    CurrentPage:
      description: The current page number
      schema:
        type: integer
        format: int32
    RateLimitLimit:
      description: The total number of requests available per time frame
      schema:
        type: integer
        format: int32
    RateLimitRemaining:
      description: The number of requests left in the current time frame
      schema:
        type: integer
        format: int32
    RateLimitReset:
      description: Seconds left in the current time frame, e.g. "432 seconds"
      schema:
        type: string
    TotalCount:
      description: The total number of resources found for the specified conditions
      schema:
        type: integer
        format: int32
    TotalPages:
      description: The total number of pages
      schema:
        type: integer
        format: int32
  parameters:
    Fields:
      name: fields
      in: query
      description: List of fields that should be returned. Id is always returned. Fields should be separated
        by comma
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PerPage:
      name: perPage
      in: query
      description: Requested number of results per page
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        maximum: 1000
        minimum: 1
    fileId:
      name: fileId
      in: path
      description: The file ID
      required: true
      schema:
        type: string
      example: 6Yh
    folderId:
      name: folderId
      in: path
      description: The folder ID
      required: true
      schema:
        type: string
      example: Pa5
  requestBodies:
    NewFile:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewFile'
    NewFolder:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewFolder'
  responses:
    File:
      description: The file details
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/File'
    FileList:
      description: The list of files
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        CurrentPage:
          $ref: '#/components/headers/CurrentPage'
        TotalPages:
          $ref: '#/components/headers/TotalPages'
        TotalCount:
          $ref: '#/components/headers/TotalCount'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/File'
    Folder:
      description: The folder details
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Folder'
    FoldersList:
      description: The list of folders
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        CurrentPage:
          $ref: '#/components/headers/CurrentPage'
        TotalPages:
          $ref: '#/components/headers/TotalPages'
        TotalCount:
          $ref: '#/components/headers/TotalCount'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Folder'
    Quota:
      description: Storage space information
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Quota'
  schemas:
    BaseFile:
      properties:
        name:
          description: The file name
          type: string
          maxLength: 255
          minLength: 1
          example: image
        extension:
          description: The file extension
          type: string
          example: jpg
        folder:
          description: The folder where the file is stored
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/FolderShort'
      type: object
    ErrorResponse:
      required:
      - httpStatus
      - code
      - codeDescription
      - message
      - moreInfo
      - context
      - uuid
      properties:
        httpStatus:
          description: HTTP response code
          type: integer
          format: int32
        code:
          description: API error code
          type: integer
          format: int32
        codeDescription:
          description: API error code description
          type: string
        message:
          description: Error message
          type: string
        moreInfo:
          description: URL to error description in the API Docs
          type: string
        context:
          type: object
        uuid:
          description: UUID of the error response
          type: string
      type: object
    File:
      required:
      - fileId
      type: object
      allOf:
      - properties:
          fileId:
            description: The file ID
            type: string
            readOnly: true
            example: 6rZ6
          fileSize:
            description: The file size
            type: integer
            format: int64
            readOnly: true
            example: 579644
          group:
            $ref: '#/components/schemas/FileGroup'
          thumbnail:
            description: The direct URL to the file thumbnail
            type: string
            format: uri
            readOnly: true
            example: https://us-rs.gr-cdn.com/512x,sBIbGHAUIQfw7kTUjaD0fTzxfXPggsY_1WCWIKl3RAxE=/https://multimedia.getresponse.com/getresponse-ZJtEw/photos/05c53ab1-6119-4076-a96c-bbefa082ea1a.jpg
            nullable: true
          url:
            description: The direct URL to resource
            type: string
            format: uri
            readOnly: true
            example: https://multimedia.getresponse.com/getresponse-ZJtEw/photos/05c53ab1-6119-4076-a96c-bbefa082ea1a.jpg
          properties:
            description: The file properties (available only for the `photos` group)
            type: array
            items:
              $ref: '#/components/schemas/FileProperty'
            maxItems: 2
            minItems: 0
            readOnly: true
          createdOn:
            description: The creation date
            type: string
            format: date-time
            readOnly: true
            example: 2019-10-12T15:15:49+0000
          href:
            description: Direct hyperlink to a resource
            type: string
            format: uri
            readOnly: true
            example: https://api.getresponse.com/v3/file-library/files/6pS
      - $ref: '#/components/schemas/BaseFile'
    FileGroup:
      description: The file group
      type: string
      enum:
      - audio
      - video
      - photo
      - document
      example: photo
    FileProperty:
      required:
      - name
      - value
      properties:
        name:
          type: string
          enum:
          - width
          - height
          readOnly: true
          example: width
        value:
          readOnly: true
          oneOf:
          - type: integer
            example: 1980
          - type: string
      type: object
    Folder:
      required:
      - folderId
      properties:
        folderId:
          description: The folder ID
          type: string
          readOnly: true
          example: t1G
        name:
          description: The folder name
          type: string
          maxLength: 128
          minLength: 1
          example: sample folder
        size:
          description: The size of all files in the directory
          type: integer
          format: int64
          example: 9564899
        createdOn:
          description: The creation date
          type: string
          format: date-time
          readOnly: true
          example: 2019-10-14T17:17:13+0000
      type: object
    FolderShort:
      required:
      - folderId
      properties:
        folderId:
          description: The folder ID
          type: string
          example: 4a9f
      type: object
    NewFile:
      required:
      - name
      - extension
      - content
      - folder
      type: object
      allOf:
      - properties:
          content:
            description: The base64 encoded file content
            type: string
            format: byte
            example: dGVzdCBjb250ZW50
      - $ref: '#/components/schemas/BaseFile'
    NewFolder:
      required:
      - name
      properties:
        name:
          description: The folder name
          type: string
          maxLength: 128
          minLength: 1
          example: sample folder
      type: object
    Quota:
      properties:
        limit:
          description: The total size of available storage space
          type: integer
          format: int64
          example: 1048576
        usage:
          description: The currently used storage space
          type: integer
          format: int64
          example: 1024
      type: object
    SortOrderEnum:
      type: string
      enum:
      - ASC
      - DESC
    StringBooleanEnum:
      type: string
      enum:
      - 'true'
      - 'false'
  securitySchemes:
    api-key:
      type: apiKey
      description: Header value must be prefixed with api-key
      name: X-Auth-Token
      in: header
    oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.getresponse.com/oauth2_authorize.html
          scopes:
            all: all data access
        authorizationCode:
          authorizationUrl: https://app.getresponse.com/oauth2_authorize.html
          tokenUrl: https://api.getresponse.com/v3/token
          scopes:
            all: all data access
        clientCredentials:
          tokenUrl: https://api.getresponse.com/v3/token
          scopes:
            all: all data access
