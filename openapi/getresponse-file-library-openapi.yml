  /file-library/files:
    get:
      tags:
      - File Library
      summary: Get the list of files
      description: 'By default, you can only search files in the root directory. To search for files in
        all folders, use the parameter `query[allFolders]=true`. To search for files in a specified folder,
        use the parameter `query[folderId]=<folderId>`. **Note: these two parameters can''t be used together**.
        You can filter the resource using criteria specified as `query[*]`. You can provide multiple criteria,
        to use AND logic. You can sort the resource using parameters specified as `sort[*]`. You can specify
        multiple fields to sort by.'
      operationId: getFileList
      parameters:
      - name: query[allFolders]
        in: query
        description: Return files from all folders, including the root folder. **This parameter can't
          be used together with ** `query[folderId]`
        required: false
        schema:
          $ref: '#/components/schemas/StringBooleanEnum'
      - name: query[folderId]
        in: query
        description: Search for files in a specific folder. **This parameter can't be used together with
          ** `query[allFolders]`
        required: false
        schema:
          type: string
      - name: query[name]
        in: query
        description: Search for files by name
        required: false
        schema:
          type: string
      - name: query[group]
        in: query
