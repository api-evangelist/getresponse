components:
  headers:
    CurrentPage:
      description: The current page number
      schema:
        type: integer
        format: int32
    RateLimitLimit:
      description: The total number of requests available per time frame
      schema:
        type: integer
        format: int32
    RateLimitRemaining:
      description: The number of requests left in the current time frame
      schema:
        type: integer
        format: int32
    RateLimitReset:
      description: Seconds left in the current time frame, e.g. "432 seconds"
      schema:
        type: string
    TotalCount:
      description: The total number of resources found for the specified conditions
      schema:
        type: integer
        format: int32
    TotalPages:
      description: The total number of pages
      schema:
        type: integer
        format: int32
  parameters:
    Fields:
      name: fields
      in: query
      description: List of fields that should be returned. Id is always returned. Fields should be separated
        by comma
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PerPage:
      name: perPage
      in: query
      description: Requested number of results per page
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        maximum: 1000
        minimum: 1
    autoresponderId:
      name: autoresponderId
      in: path
      description: The autoresponder ID.
      required: true
      schema:
        type: string
      example: Q
  requestBodies:
    NewAutoresponder:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewAutoresponder'
    UpdateAutoresponder:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAutoresponder'
  responses:
    AutoresponderDetails:
      description: The autoresponder details'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AutoresponderDetails'
    AutoresponderList:
      description: The list of autoresponders.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        CurrentPage:
          $ref: '#/components/headers/CurrentPage'
        TotalPages:
          $ref: '#/components/headers/TotalPages'
        TotalCount:
          $ref: '#/components/headers/TotalCount'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AutoresponderList'
    MessageStatisticsList:
      description: The list of autoresponders statistic split by time interval.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        CurrentPage:
          $ref: '#/components/headers/CurrentPage'
        TotalPages:
          $ref: '#/components/headers/TotalPages'
        TotalCount:
          $ref: '#/components/headers/TotalCount'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageStatisticsListElement'
    SingleMessageStatisticsList:
      description: The list of autoresponder statistics split by time interval.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        CurrentPage:
          $ref: '#/components/headers/CurrentPage'
        TotalPages:
          $ref: '#/components/headers/TotalPages'
        TotalCount:
          $ref: '#/components/headers/TotalCount'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageStatisticsListElement'
  schemas:
    Autoresponder:
      properties:
        autoresponderId:
          description: The autoresponder ID
          type: string
          readOnly: true
          example: Q
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/autoresponders/Q
        name:
          description: The autoresponder name
          type: string
          maxLength: 128
          minLength: 2
          example: Message 2
        subject:
          description: The autoresponder message subject
          type: string
          maxLength: 128
          minLength: 2
          example: test12
        campaignId:
          description: The campaign ID. The system will assign the autoresponder to a default campaign
            if you don't provide a specific campaign ID.
          type: string
          example: V
        status:
          description: The autoresponder status
          example: enabled
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
        fromField:
          description: The from email address used for the message
          allOf:
          - $ref: '#/components/schemas/FromFieldReference'
        replyTo:
          description: The email that will be used as a reply-to address
          allOf:
          - $ref: '#/components/schemas/FromFieldReference'
        content:
          $ref: '#/components/schemas/MessageContent'
        flags:
          $ref: '#/components/schemas/MessageFlagsArray'
        trackOpens:
          description: Enables open tracking for the autoresponder message. When true, message opens are
            tracked; when false, they are not. Defaults to true when omitted.
          example: 'true'
          allOf:
          - $ref: '#/components/schemas/StringBooleanEnum'
        triggerSettings:
          description: 'The conditions that will trigger the autoresponder '
          allOf:
          - $ref: '#/components/schemas/AutoresponderTriggerSettings'
        statistics:
          description: The autoresponder statistics summary
          type: object
          readOnly: true
          allOf:
          - properties:
              delivered:
                type: number
                format: float
                example: '0'
              openRate:
                type: number
                format: float
                example: '0'
              clickRate:
                type: number
                format: float
                example: '0'
            type: object
        createdOn:
          description: The creation date
          type: string
          format: date-time
          readOnly: true
      type: object
    AutoresponderDetails:
      type: object
      allOf:
      - properties:
          clickTracks:
            description: The list of tracked links
            type: array
            items:
              $ref: '#/components/schemas/ClickTrack'
          campaign:
            description: The autoresponder campaign (list)
            allOf:
            - properties:
                id:
                  description: Campaign ID
                  type: string
                  example: C
                href:
                  description: Direct hyperlink to a resource
                  type: string
                  format: uri
                  readOnly: true
                  example: https://api.getresponse.com/v3/campaigns/C
                name:
                  description: The campaign name
                  type: string
                  readOnly: true
                  example: Promo campaign
                  nullable: true
              type: object
          editor:
            allOf:
            - $ref: '#/components/schemas/NewMessageEditorEnumOutput'
          sendSettings:
            type: object
            allOf:
            - properties:
                externalLexpad:
                  $ref: '#/components/schemas/ExternalLexpad'
            - $ref: '#/components/schemas/AutoresponderSendSettingsOutput'
      - $ref: '#/components/schemas/Autoresponder'
    AutoresponderList:
      type: array
      items:
        type: object
        allOf:
        - properties:
            campaign:
              description: The autoresponder campaign (list)
              allOf:
              - $ref: '#/components/schemas/CampaignReference'
            sendSettings:
              $ref: '#/components/schemas/AutoresponderSendSettingsOutput'
        - $ref: '#/components/schemas/Autoresponder'
    AutoresponderSendSettingsDelayInHours:
      description: How many hours to delay the message after a trigger occured, in the 0-23 format
      type: integer
      format: int32
      maximum: 23
      exclusiveMaximum: false
      minimum: 0
      exclusiveMinimum: false
    AutoresponderSendSettingsExcludedDaysOfWeek:
      description: The days of the week to exclude from message sending (the message will be sent on the
        next non-excluded day after the trigger)
      type: array
      items:
        type: string
        enum:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
    AutoresponderSendSettingsInput:
      description: How the message will be delivered to the subscriber
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/AutoresponderSendSettingsType'
        timeTravel:
          $ref: '#/components/schemas/AutoresponderSendSettingsTimeTravel'
        excludedDaysOfWeek:
          $ref: '#/components/schemas/AutoresponderSendSettingsExcludedDaysOfWeek'
        externalLexpad:
          $ref: '#/components/schemas/ExternalLexpad'
      type: object
      discriminator:
        propertyName: type
        mapping:
          signup: '#/components/schemas/AutoresponderSendSignupSettings'
          immediately: '#/components/schemas/AutoresponderSendImmediatelySettings'
          delay: '#/components/schemas/AutoresponderSendDelaySettings'
          custom: '#/components/schemas/AutoresponderSendCustomSettings'
    AutoresponderSendSettingsOutput:
      description: How the message will be delivered to the subscriber
      properties:
        type:
          $ref: '#/components/schemas/AutoresponderSendSettingsType'
        timeTravel:
          $ref: '#/components/schemas/AutoresponderSendSettingsTimeTravel'
        excludedDaysOfWeek:
          $ref: '#/components/schemas/AutoresponderSendSettingsExcludedDaysOfWeek'
        delayInHours:
          $ref: '#/components/schemas/AutoresponderSendSettingsDelayInHours'
        sendAtHour:
          $ref: '#/components/schemas/AutoresponderSendSettingsSendAtHour'
        recurrence:
          example: 'true'
          deprecated: true
      type: object
    AutoresponderSendSettingsSendAtHour:
      description: The specific hour on which the message will be sent, in the 0-23 format
      type: integer
      format: int32
      maximum: 23
      exclusiveMaximum: false
      minimum: 0
      exclusiveMinimum: false
    AutoresponderSendSettingsTimeTravel:
      description: Should the message be sent in the user's or the subscriber's time zone
      type: string
      example: 'true'
      allOf:
      - $ref: '#/components/schemas/StringBooleanEnum'
    AutoresponderSendSettingsType:
      description: When to send the message
      type: string
      enum:
      - signup
      - immediately
      - delay
      - custom
    AutoresponderTriggerSettings:
      description: 'The conditions that will trigger the autoresponder '
      properties:
        type:
          description: The trigger type
          type: string
          default: onday
          enum:
          - onday
          deprecated: true
        dayOfCycle:
          description: For onday type the day of the autoresponder cycle in the 0-9999 format
          type: integer
          format: int32
          maximum: 9999
          exclusiveMaximum: false
          minimum: 0
          exclusiveMinimum: false
        autoresponder:
          type: string
          readOnly: true
          nullable: true
          deprecated: true
        newsletter:
          type: string
          readOnly: true
          nullable: true
          deprecated: true
        clickTrackId:
          type: string
          readOnly: true
          nullable: true
          deprecated: true
        goal:
          type: string
          readOnly: true
          nullable: true
          deprecated: true
        custom:
          type: string
          readOnly: true
          nullable: true
          deprecated: true
        newCustomValue:
          type: string
          readOnly: true
          nullable: true
          deprecated: true
        action:
          type: string
          readOnly: true
          nullable: true
          deprecated: true
        selectedCampaigns:
          $ref: '#/components/schemas/MessageSendSettingSelectedCampaigns'
        selectedSegments:
          readOnly: true
          deprecated: true
      type: object
    CampaignReference:
      required:
      - campaignId
      properties:
        campaignId:
          description: Campaign ID
          type: string
          example: C
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/campaigns/C
        name:
          description: The campaign name
          type: string
          readOnly: true
          example: Promo campaign
          nullable: true
      type: object
    ClickTrack:
      properties:
        clickTrackId:
          type: string
          example: C
        url:
          description: The tracked link
          type: string
          format: uri
          example: https://example.com
        name:
          description: The tracked link name
          type: string
          example: press here
        amount:
          description: The number of clicks on a link in a message
          type: string
          example: '15'
      type: object
    DateOrDateTime:
      oneOf:
      - type: string
        format: date
        example: '2018-04-15'
      - type: string
        format: date-time
        example: 2018-01-15T13:30:42+0000
    ErrorResponse:
      required:
      - httpStatus
      - code
      - codeDescription
      - message
      - moreInfo
      - context
      - uuid
      properties:
        httpStatus:
          description: HTTP response code
          type: integer
          format: int32
        code:
          description: API error code
          type: integer
          format: int32
        codeDescription:
          description: API error code description
          type: string
        message:
          description: Error message
          type: string
        moreInfo:
          description: URL to error description in the API Docs
          type: string
        context:
          type: object
        uuid:
          description: UUID of the error response
          type: string
      type: object
    ExternalLexpad:
      description: 'External Lexpad settings for the message, read more: [External Lexpad](https://apidocs.getresponse.com/v3/dynamic-content/external-lexpad)'
      required:
      - dataSourceUrl
      properties:
        dataSourceUrl:
          description: URL to the endpoint that will provide data for External Lexpad
          type: string
          format: uri
          maxLength: 2048
          minLength: 1
          example: https://example.com/external_lexpad
        dataSourceToken:
          description: Token that will be sent in `X-Auth-Token` header to authenticate the requests made
            to the endpoint
          type: string
          maxLength: 255
          minLength: 0
          example: cf4dfca78434bf927a7655c0c4d95a2a45c33b71
          nullable: true
      type: object
    FromFieldReference:
      required:
      - fromFieldId
      properties:
        fromFieldId:
          description: The 'From' address ID
          type: string
          example: V
        href:
          description: Direct hyperlink to a resource
          type: string
          format: uri
          readOnly: true
          example: https://api.getresponse.com/v3/from-fields/V
      type: object
    MessageContent:
      description: The message content.
      properties:
        html:
          description: The message content in HTML
          type: string
          maxLength: 524288
          example: <h1>test 12</h1><p>Some test <a href="http://example.com">http://example.com</a></p>
        plain:
          description: The plain text equivalent of the message content
          type: string
          maxLength: 524288
          example: test 12 Some test
      type: object
    MessageFlagsArray:
      description: The message flags.
      type: array
      items:
        type: string
        enum:
        - clicktrack
        - google_analytics
    MessageSendSettingSelectedCampaigns:
      description: A one-element array containing the Campaign ID to filter subscribers. Any additional
        elements in the array will be ignored.
      type: array
      items:
        type: string
        example: C
    MessageStatisticsListElement:
      properties:
        timeInterval:
          description: The statistics time frame in the ISO 8601 datetime format with duration interval
          type: string
          pattern: /^([\+-]?\d{4}(?!\d{2}\b))((-?)((0[1-9]|1[0-2])(\3([12]\d|0[1-9]|3[01]))?|W([0-4]\d|5[0-2])(-?[1-7])?|(00[1-9]|0[1-9]\d|[12]\d{2}|3([0-5]\d|6[1-6])))([T\s]((([01]\d|2[0-3])((:?)[0-5]\d)?|24\:?00)([\.,]\d+(?!:))?)?(\17[0-5]\d([\.,]\d+)?)?([zZ]|([\+-])([01]\d|2[0-3]):?([0-5]\d)?)?)?)?(\/)P(?=\w*\d)(?:\d+Y|Y)?(?:\d+M|M)?(?:\d+W|W)?(?:\d+D|D)?(?:T(?:\d+H|H)?(?:\d+M|M)?(?:\d+(?:\­.\d{1,2})?S|S)?)?$/
          example: 2014-09-20T00:00:00+0000/P2M18DT10H0M0S
        sent:
          type: integer
          format: int32
        totalOpened:
          type: integer
          format: int32
        totalHumanOpened:
          type: integer
          format: int32
        uniqueOpened:
          type: integer
          format: int32
        uniqueHumanOpened:
          type: integer
          format: int32
        totalClicked:
          type: integer
          format: int32
        totalHumanClicked:
          type: integer
          format: int32
        uniqueClicked:
          type: integer
          format: int32
        uniqueHumanClicked:
          type: integer
          format: int32
        goals:
          type: integer
          format: int32
        uniqueGoals:
          type: integer
          format: int32
        forwarded:
          type: integer
          format: int32
        unsubscribed:
          type: integer
          format: int32
        bounced:
          type: integer
          format: int32
        complaints:
          type: integer
          format: int32
      type: object
    NewAutoresponder:
      required:
      - status
      - subject
      - content
      - sendSettings
      - triggerSettings
      type: object
      allOf:
      - properties:
          sendSettings:
            $ref: '#/components/schemas/AutoresponderSendSettingsInput'
      - $ref: '#/components/schemas/Autoresponder'
    NewMessageEditorEnumOutput:
      description: 'How the message was created: `editor_v3` - created by GetResponse editor, `text` means
        plain text content, `html` means custom HTML content, `getresponse` is a deprecated, legacy GetResponse
        editor.'
      type: string
      enum:
      - editor_v3
      - getresponse
      - text
      - html
    SortOrderEnum:
      type: string
      enum:
      - ASC
      - DESC
    StatusEnum:
      type: string
      enum:
      - enabled
      - disabled
    StringBooleanEnum:
      type: string
      enum:
      - 'true'
      - 'false'
    UpdateAutoresponder:
      type: object
      allOf:
      - properties:
          sendSettings:
            $ref: '#/components/schemas/AutoresponderSendSettingsInput'
      - $ref: '#/components/schemas/Autoresponder'
  securitySchemes:
    api-key:
      type: apiKey
      description: Header value must be prefixed with api-key
      name: X-Auth-Token
      in: header
    oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.getresponse.com/oauth2_authorize.html
          scopes:
            all: all data access
        authorizationCode:
          authorizationUrl: https://app.getresponse.com/oauth2_authorize.html
          tokenUrl: https://api.getresponse.com/v3/token
          scopes:
            all: all data access
        clientCredentials:
          tokenUrl: https://api.getresponse.com/v3/token
          scopes:
            all: all data access
