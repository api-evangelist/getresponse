      summary: The statistics for all autoresponders
      description: ">\nThis returns the statistics summary for selected autoresponders. You can select\
        \ them by specifying the autoresponder or campaign IDs.\nAs in all statistics, you can change\
        \ the date and time range  (hourly daily monthly or total). Keep in mind\nthat all statistics\
        \ date ranges are given in standard UTC period type objects. ([See ISO 8601 standard](http://en.wikipedia.org/wiki/ISO_8601#Time_intervals))\n\
