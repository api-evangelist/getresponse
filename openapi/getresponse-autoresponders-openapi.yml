  /autoresponders/{autoresponderId}/statistics:
    get:
      tags:
      - Autoresponders
      summary: The statistics for a single autoresponder
      description: ">\nThis requst returns the statistics summary for a single given autoresponder. As\
        \ in all statistics, you can change the date and time range  (hourly daily monthly or total).\
        \ Keep in mind\nthat all statistics date ranges are given in standard UTC period type objects.\
        \ ([See ISO 8601 standard](http://en.wikipedia.org/wiki/ISO_8601#Time_intervals))\n\n(https://app.getresponse.com/statistics.html?t=followup#total).\n\
        \ You can filter the resource using criteria specified as `query[*]`. You can provide multiple\
        \ criteria, to use AND logic. You can sort the resource using parameters specified as `sort[*]`.\
        \ You can specify multiple fields to sort by."
      operationId: getSingleAutoresponderStatistics
      parameters:
      - name: query[groupBy]
        in: query
        description: Group results by time interval
        required: false
        schema:
          type: string
          enum:
          - total
          - hour
          - day
          - month
      - name: query[createdOn][from]
        in: query
        description: Count data from this date
        required: false
        schema:
          $ref: '#/components/schemas/DateOrDateTime'
