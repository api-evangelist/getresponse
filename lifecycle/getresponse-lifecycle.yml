  docs: https://apidocs.getresponse.com/v3
  policy: >-
    GetResponse states that future updates will be backward compatible and that the version
    number increments only for breaking changes. There is no dedicated versioning-policy page;
    the statement lives in the API docs overview. The OpenAPI info.version is a build timestamp
    rather than a semantic version, which does at least let a consumer tell when the contract
    was last regenerated.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No published deprecation policy, no Sunset or Deprecation response headers, and no advance
    notice window stated anywhere in the developer documentation. The only deprecation signal
    GetResponse ships is the `deprecated: true` flag inside the OpenAPI itself, on two
    operations. Because no policy pointer exists, none is emitted.
deprecated_operations:
  - operation: getNewsletterActivities
