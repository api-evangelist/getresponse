key_lifecycle:
  api_key_expiry_days: 90
  note: >-
    Unused API keys expire after 90 days of inactivity and must be regenerated at
    https://app.getresponse.com/api. This is a real operational trap for a low-frequency
    integration or an agent that runs on a monthly cadence — the credential silently dies
    between runs and returns error code 1014.
