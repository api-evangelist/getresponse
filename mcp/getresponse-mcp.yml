gaps_for_agents:
  - >-
    No idempotency key — a retried send_newsletter can dispatch twice. Error code 1011
    ("newsletter already being sent") is the only guard, and it is a 400, not a replayed 200.
  - >-
    OAuth offers a single "all" scope, so a delegated agent token cannot be scoped down to
    read-only. Least privilege is not expressible.
  - >-
    Webhook subscriptions cannot be created through the API, so an agent cannot self-provision
    the "Import finished" callback it needs to confirm an async contact import.
